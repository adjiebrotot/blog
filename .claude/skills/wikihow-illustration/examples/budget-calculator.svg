    <path id="pig" d="M548 476 C548 432 590 410 630 416 C668 422 692 446 690 478 C688 502 674 516 664 520 L664 536 L648 536 L646 524 C626 528 604 528 588 524 L586 536 L570 536 L568 518 C556 510 548 494 548 476 Z"/>

    <clipPath id="c-torso"><use href="#torso"/></clipPath>
    <clipPath id="c-neck"><use href="#neck"/></clipPath>
    <clipPath id="c-face"><use href="#face"/></clipPath>
    <clipPath id="c-hair"><use href="#hair"/></clipPath>
    <clipPath id="c-armL"><use href="#armL"/></clipPath>
