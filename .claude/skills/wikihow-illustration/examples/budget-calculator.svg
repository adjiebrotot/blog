    <rect x="356" y="382" width="16" height="12" rx="3" transform="rotate(-4 364 388)"/>
    <rect x="380" y="380" width="16" height="12" rx="3" transform="rotate(-4 388 386)"/>
    <rect x="334" y="406" width="16" height="12" rx="3" transform="rotate(-4 342 412)"/>
    <rect x="358" y="404" width="16" height="12" rx="3" transform="rotate(-4 366 410)"/>
    <rect x="382" y="402" width="16" height="12" rx="3" transform="rotate(-4 390 408)" fill="#F08A3C"/>
  </g>

