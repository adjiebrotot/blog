  <path d="M328 342 L404 336 L406 368 L330 374 Z" fill="#CFE8D5" stroke="#283247" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="400" y="364" text-anchor="end" font-family="Arial, sans-serif" font-weight="700" font-size="20" fill="#2E4A3A" transform="rotate(-4 368 356)">1,250</text>
  <g fill="#E8EDF5" stroke="#283247" stroke-width="2">
