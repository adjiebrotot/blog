  <circle cx="347.5" cy="160.5" r="1.2" fill="#FFFFFF"/><circle cx="385.5" cy="160.5" r="1.2" fill="#FFFFFF"/>
  <path d="M332 162 C340 154 350 154 357 161" fill="none" stroke="#3B2416" stroke-width="3" stroke-linecap="round"/>
  <path d="M371 161 C378 154 388 154 396 162" fill="none" stroke="#3B2416" stroke-width="3" stroke-linecap="round"/>
