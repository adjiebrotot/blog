  <path d="M370 146 C378 142 390 142 398 148" fill="none" stroke="#5E3720" stroke-width="4" stroke-linecap="round"/>
  <path d="M366 168 C368 180 370 188 372 194 C368 198 362 198 358 196" fill="none" stroke="#B5774F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M346 210 C356 218 372 218 384 208" fill="none" stroke="#8E4A35" stroke-width="3" stroke-linecap="round"/>
  <path d="M352 220 C360 223 368 223 374 220" fill="none" stroke="#DFA883" stroke-width="2.5" stroke-linecap="round"/>

