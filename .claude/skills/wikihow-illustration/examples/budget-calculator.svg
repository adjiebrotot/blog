  <!-- 1. Background: pale, soft, almost empty. -->
  <rect width="728" height="546" fill="url(#bg)"/>
  <path d="M0 120 C120 80 220 140 330 110 C470 70 600 120 728 90 L728 0 L0 0 Z" fill="#E8F2F8"/>
  <rect x="520" y="60" width="150" height="190" rx="6" fill="#EEF6FB" stroke="#B7CFDF" stroke-width="3"/>
  <path d="M595 60 L595 250 M520 155 L670 155" stroke="#B7CFDF" stroke-width="3"/>
  <path d="M540 80 L580 80 M610 80 L650 140" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity=".7"/>

  <!-- 2. Body, back to front. -->
  <use href="#torso" fill="#F08A3C"/>
  <g clip-path="url(#c-torso)">
    <path d="M226 546 C232 420 250 336 300 300 C290 360 296 440 310 546 Z" fill="#D46F25"/>
    <path d="M330 284 C350 300 378 300 398 284 L398 300 C378 314 350 314 330 300 Z" fill="#D46F25"/>
  </g>
  <use href="#torso" fill="none" stroke="#A9531A" stroke-width="3" stroke-linejoin="round"/>
  <path d="M332 282 C348 300 380 300 396 282" fill="none" stroke="#A9531A" stroke-width="3" stroke-linecap="round"/>

  <use href="#neck" fill="#F2C9A5"/>
  <g clip-path="url(#c-neck)"><path d="M330 220 L400 220 L400 250 C384 262 346 262 330 250 Z" fill="#DFA883"/></g>
  <use href="#neck" fill="none" stroke="#B5774F" stroke-width="3" stroke-linejoin="round"/>

