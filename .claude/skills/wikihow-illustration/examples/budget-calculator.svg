  <path d="M598 434 L630 432" stroke="#B4596C" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="682" cy="470" rx="13" ry="16" fill="#F7BFCB" stroke="#B4596C" stroke-width="3"/>
  <circle cx="679" cy="466" r="2.5" fill="#B4596C"/><circle cx="684" cy="474" r="2.5" fill="#B4596C"/>
  <circle cx="660" cy="452" r="4" fill="#3B2416"/>
  <path d="M640 424 C646 410 660 408 664 420" fill="#F4A9B8" stroke="#B4596C" stroke-width="3" stroke-linejoin="round"/>
  <path d="M564 462 C568 446 580 436 594 430" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity=".6"/>
</svg>
