# The point of interest of each illustration that gets cropped (the post-card thumbnail,
# the social card drawn by _build/og.mjs and the share poster). Every crop, of any shape,
# is moved so this box stays whole; when the box is too big for the crop, the crop centres
# on it across and keeps its top edge (heads sit at the top). Pick the subject a reader
# must see: one whole person in a split or multi-panel picture, not the seam between them.
#
#   <file in assets/img/>: { box: [x0, y0, x1, y1], size: [width, height] }
#
# box is in percent of the picture, left/top edge to right/bottom edge; size is in pixels.
# `python3 _build/focus.py` lists cropped pictures that have no entry yet (with their size),
# checks each size and, with --preview DIR, draws a preview of every crop shape for checking.

