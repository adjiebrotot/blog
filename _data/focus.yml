# The point of interest of every illustration (each *-ill-*.webp, and any picture set as a
# post's `thumbnail:` or `share_image:`). The post cards, the social card (_build/og.mjs)
# and the share poster crop it to their own shape, and every crop moves to keep this box
# whole; when the box is too big for a frame, the crop centres on it across and keeps its
# top edge (heads sit at the top). Mandatory: how to choose the box, and what never to box,
# is in .claude/skills/wikihow-illustration/references/focus-box.md.
#
#   <file in assets/img/>: { box: [x0, y0, x1, y1], size: [width, height] }   # the subject
#
# box: percent of the picture, left/top edge to right/bottom edge. size: pixels. The comment
# names what the box keeps (required). `python3 _build/focus.py --new <file>` prints a line
# to fill in; `python3 _build/focus.py --preview <dir>` draws every crop to look at.

