{%- include context.html -%}
<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  {% include head.html %}
</head>
<body data-copy="{{ t.copy }}" data-copied="{{ t.copied }}" data-contents="{{ t.contents }}"{% if site.adsense.fill_units %} data-ad-client="{{ site.adsense.client }}" data-ad-label="{{ t.ad_label }}" data-ad-units="{{ site.adsense.fill_units | jsonify | escape }}"{% endif %}>
  <a class="skip-link" href="#main">{{ t.skip }}</a>
  {% include header.html %}
  <main id="main" class="container">
{{ content }}
  </main>
  {% include footer.html %}
  <script src="{{ '/assets/js/blog.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
</body>
</html>
