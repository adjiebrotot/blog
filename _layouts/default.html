{%- include context.html -%}
<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  {% include head.html %}
</head>
<body data-copy="{{ t.copy }}" data-copied="{{ t.copied }}" data-contents="{{ t.contents }}"{% if site.adsense.fill_units %} data-ad-client="{{ site.adsense.client }}" data-ad-label="{{ t.ad_label }}" data-ad-units="{{ site.adsense.fill_units | jsonify | escape }}"{% endif %}>
  <a class="skip-link" href="#main">{{ t.skip }}</a>
  {% include header.html %}
  <main id="main" class="container">
{{ content }}
  </main>
  {% include footer.html %}
  <script src="{{ '/assets/js/blog.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
  <script src="{{ '/assets/js/bmc.js' | relative_url }}" defer></script>
  <script data-name="BMC-Widget" data-cfasync="false" src="https://cdnjs.buymeacoffee.com/1.0.0/widget.prod.min.js" data-id="adjiebrotot" data-description="Support me on Buy me a coffee!" data-message="Thank you for your iced latte. Now, I can wake up at night and create something more for you :)" data-color="#FF813F" data-position="Right" data-x_margin="16" data-y_margin="16"></script>
</body>
</html>
