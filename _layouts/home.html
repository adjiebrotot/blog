---
layout: default
---
{%- include context.html -%}
{%- assign _posts = site.posts | where: "lang", lang -%}
{{ content }}
<section aria-labelledby="latest-heading">
  <h1 id="latest-heading" class="page-title">{{ t.latest }}</h1>
  {%- if _posts.size > 0 %}
  <div class="post-grid">
    {%- for p in _posts %}
    {% include post-card.html post=p lang=lang %}
    {%- endfor %}
  </div>
  {%- else %}
  <p class="empty">{{ t.no_posts }}</p>
  {%- endif %}
</section>
