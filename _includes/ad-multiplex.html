{%- comment -%}
  The AdSense multiplex unit after a post or under a home page's list, labelled
  so its grid of ads never passes for the blog's own posts. The loader script
  is in head.html. Placed by post.html, home.html and landing.html, never by hand.
{%- endcomment -%}
<aside class="ad-slot ad-end" aria-label="{{ t.ad_label }}">
  <p class="ad-label">{{ t.ad_label }}</p>
  <ins class="adsbygoogle"
       style="display:block"
       data-ad-format="autorelaxed"
       data-ad-client="{{ site.adsense.client }}"
       data-ad-slot="{{ site.adsense.multiplex_slot }}"></ins>
  <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
</aside>
