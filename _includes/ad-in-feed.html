{%- comment -%}
  The AdSense in-feed unit among a home page's post cards, labelled and drawn
  without the cards' sticker so it never passes for one of the blog's posts.
  The loader script is in head.html. Placed by home.html and landing.html,
  never by hand.
{%- endcomment -%}
<aside class="ad-slot ad-feed" aria-label="{{ include.t.ad_label }}">
  <p class="ad-label">{{ include.t.ad_label }}</p>
  <ins class="adsbygoogle"
       style="display:block"
       data-ad-format="fluid"
       data-ad-layout-key="{{ site.adsense.in_feed_layout_key }}"
       data-ad-client="{{ site.adsense.client }}"
       data-ad-slot="{{ site.adsense.in_feed_slot }}"></ins>
  <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
</aside>
