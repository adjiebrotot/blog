# Adjie Brotot Blog: built by GitHub Pages' own Jekyll ("Deploy from branch").
# Only plugins GitHub Pages ships are used, so there is no build step to run.

title: Adjie Brotot Blog
# No GitHub Pages default theme (primer): every layout and style is our own.
theme: null
# The brand in the header, split like the tool site's "Adjie Brotools".
brand_a: Adjie
brand_b: Brotot Blog

url: "https://blog.adjiebrotots.com"
baseurl: ""
repository: adjiebrotot/blog
timezone: Australia/Perth

languages: [en, id]
default_lang: en

author:
  # One @id for the person across www, tool and blog, so search engines and
  # answer engines join them into one entity.
  id: "https://www.adjiebrotots.com/#person"
  name: Adjie Brotosukmono
  # The same names, photo and facts as the person node on www and tool.
  alternate_name: [Adjie, Harso Adjie Brotosukmono, Adjie Brotot, adjiebrotot]
  email: adjiebrotots@gmail.com
  url: "https://www.adjiebrotots.com/"
  image: "https://www.adjiebrotots.com/assets/img/adjie.jpg"
  job_title: Senior Economics Consultant
  works_for: { name: Mott MacDonald, url: "https://www.mottmac.com/" }
  alumni_of: { name: Institut Teknologi Bandung, alternate_name: ITB, url: "https://www.itb.ac.id/" }
  nationality: Indonesia
  # Profiles of the same person, as on www.adjiebrotots.com.
  same_as:
    - "https://www.linkedin.com/in/adjiebrotot/"
    - "https://www.instagram.com/adjiebrotot/"
    - "https://github.com/adjiebrotot"
    - "https://www.youtube.com/c/adjiebrotots"

links:
  home: "https://www.adjiebrotots.com/"
  about: "https://www.adjiebrotots.com/about/"
  tools: "https://tool.adjiebrotots.com/"
  privacy: "https://tool.adjiebrotots.com/privacy/"   # covers the blog too; the Indonesian page is privacy/id/

# Social card when a post sets no image of its own.
default_image: /assets/img/og/blog.jpg   # 1200x630 card, drawn by _build/og.mjs

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  toc_levels: 2..3
  syntax_highlighter: rouge
  # Raw HTML (iframes, embed scripts, figures) passes through untouched.
  parse_block_html: false

permalink: pretty

# Comments under each post, through giscus (GitHub Discussions). Off until
# repo_id and category_id are filled in: get them at https://giscus.app after
# installing the giscus app on the repo and turning on Discussions. Moderate on
# GitHub: delete or hide a comment, lock a thread, block a user.
comments:
  repo: ""            # e.g. adjiebrotot/blog-comments (must be public)
  repo_id: ""
  category: Announcements   # an Announcements-type category: only giscus opens threads
  category_id: ""
  theme_light: light
  theme_dark: transparent_dark

# Google AdSense. The loader is in head.html; post.html places the in-article
# unit at section breaks (before an h2 or h3) by word count: first after
# `first_after` words, then at least `gap` words apart, never with fewer than
# `tail` words left, never right under a heading (`min_lead` words of text
# before the break), at most `max` per post. That is one ad per two or three
# minutes of reading, so text always far outweighs ads. The multiplex unit goes
# once after the post (so at least `tail` words from the last in-article unit),
# and once under the post lists on the home pages (landing.html, home.html). A
# post opts out of both units with `ads: false` in its front matter. The slots
# are the blog's own (In-article 2, Multiplex 3), so AdSense reports them apart
# from the tool site's; the map of every unit on
# the three sites is in the tool repo's shared.css, above .ad-slot.
adsense:
  client: ca-pub-8730116101825381
  in_article_slot: "7068974137"
  multiplex_slot: "6347753554"
  first_after: 350
  gap: 600
  tail: 300
  min_lead: 60
  max: 5

# Whitelisted by GitHub Pages. Lets a post keep an old URL alive:
#   redirect_from: [/en/old-slug/]
plugins:
  - jekyll-redirect-from

defaults:
  # A post's URL is its language folder plus its slug, the filename without the
  # date: en/_posts/2026-10-17-my-post.md -> /en/my-post/
  - scope: { path: "en", type: posts }
    values: { lang: en, layout: post, permalink: "/en/:slug/" }
  - scope: { path: "id", type: posts }
    values: { lang: id, layout: post, permalink: "/id/:slug/" }
  - scope: { path: "en" }
    values: { lang: en }
  - scope: { path: "id" }
    values: { lang: id }

exclude:
  - README.md
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - .bundle
  - .jekyll-cache
  - md/README.txt
